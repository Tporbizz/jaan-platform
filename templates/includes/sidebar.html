{# Sidebar (icon-only) — use: include 'includes/sidebar.html' with active='dashboard' #}
<aside class="w-[72px] flex flex-col items-center py-6 gap-2 fixed h-full z-10">
    <a href="/" class="w-11 h-11 bg-cream-200 rounded-2xl flex items-center justify-center mb-4">
        <span class="text-lg">🍽️</span>
    </a>
    <a href="/dashboard/" class="sidebar-icon {% if active == 'dashboard' %}active{% endif %}" title="Dashboard">
        <span class="{% if active == 'dashboard' %}text-white{% endif %} text-sm">📊</span>
    </a>
    <a href="/pos/" class="sidebar-icon {% if active == 'pos' %}active{% endif %}" title="POS">
        <span class="{% if active == 'pos' %}text-white{% endif %} text-sm">💳</span>
    </a>
    <a href="/stock/" class="sidebar-icon {% if active == 'stock' %}active{% endif %}" title="Stock">
        <span class="{% if active == 'stock' %}text-white{% endif %} text-sm">📦</span>
    </a>
    <a href="/reports/pricing/" class="sidebar-icon {% if active == 'reports' %}active{% endif %}" title="Reports">
        <span class="{% if active == 'reports' %}text-white{% endif %} text-sm">📈</span>
    </a>
    <a href="/events/" class="sidebar-icon {% if active == 'events' %}active{% endif %}" title="Events">
        <span class="{% if active == 'events' %}text-white{% endif %} text-sm">🎪</span>
    </a>
    <a href="/hotel/" class="sidebar-icon {% if active == 'hotel' %}active{% endif %}" title="Hotel">
        <span class="{% if active == 'hotel' %}text-white{% endif %} text-sm">🏨</span>
    </a>
    <a href="/hr/" class="sidebar-icon {% if active == 'hr' %}active{% endif %}" title="กะวันนี��">
        <span class="{% if active == 'hr' %}text-white{% endif %} text-sm">👥</span>
    </a>
    <div class="flex-1"></div>
    <a href="/admin/" class="sidebar-icon" title="Settings">
        <span class="text-sm">⚙️</span>
    </a>
    {% if user.is_authenticated %}
    <a href="/logout/" class="mt-2 w-10 h-10 rounded-full bg-jaan-400 flex items-center justify-center text-white text-sm font-bold" title="{{ user.first_name }}">
        {{ user.first_name|truncatechars:1 }}
    </a>
    {% endif %}
</aside>
