{# Sidebar — text + color bar, no emoji. Use: include 'includes/sidebar.html' with active='dashboard' #}
<aside class="w-[72px] flex flex-col items-center py-5 gap-1 fixed h-full z-10 bg-cream-50 border-r border-cream-200">
    <!-- Logo -->
    <a href="/" class="w-11 h-11 bg-jaan-400 rounded-2xl flex items-center justify-center mb-3 text-white text-xs font-extrabold tracking-tight">
        จาน
    </a>

    <a href="/dashboard/" class="sidebar-item {% if active == 'dashboard' %}active{% endif %}" title="Dashboard">
        <span class="sidebar-bar"></span><span class="sidebar-label">Dash</span>
    </a>
    <a href="/pos/" class="sidebar-item {% if active == 'pos' %}active{% endif %}" title="POS">
        <span class="sidebar-bar"></span><span class="sidebar-label">POS</span>
    </a>
    <a href="/stock/" class="sidebar-item {% if active == 'stock' %}active{% endif %}" title="Stock">
        <span class="sidebar-bar"></span><span class="sidebar-label">Stock</span>
    </a>
    <a href="/reports/pricing/" class="sidebar-item {% if active == 'reports' %}active{% endif %}" title="Reports">
        <span class="sidebar-bar"></span><span class="sidebar-label">Report</span>
    </a>
    <a href="/events/" class="sidebar-item {% if active == 'events' %}active{% endif %}" title="Events">
        <span class="sidebar-bar"></span><span class="sidebar-label">Event</span>
    </a>
    <a href="/hotel/" class="sidebar-item {% if active == 'hotel' %}active{% endif %}" title="Hotel">
        <span class="sidebar-bar"></span><span class="sidebar-label">Hotel</span>
    </a>
    <a href="/hr/" class="sidebar-item {% if active == 'hr' %}active{% endif %}" title="HR / Shift">
        <span class="sidebar-bar"></span><span class="sidebar-label">HR</span>
    </a>
    <a href="/ai/" class="sidebar-item {% if active == 'ai' %}active{% endif %}" title="AI Studio">
        <span class="sidebar-bar"></span><span class="sidebar-label">AI</span>
    </a>

    <div class="flex-1"></div>

    <a href="/settings/" class="sidebar-item {% if active == 'settings' %}active{% endif %}" title="Settings">
        <span class="sidebar-bar"></span><span class="sidebar-label">Setup</span>
    </a>
    {% if user.is_authenticated %}
    <a href="/logout/" class="mt-2 w-10 h-10 rounded-full bg-jaan-400 flex items-center justify-center text-white text-xs font-bold" title="{{ user.first_name }}">
        {{ user.first_name|truncatechars:1 }}
    </a>
    {% endif %}
</aside>
