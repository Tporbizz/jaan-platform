databases:
  - name: jaan-db
    plan: free
    databaseName: jaan_platform
    user: jaan

services:
  - type: web
    name: jaan-platform
    plan: free
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn jaan_platform.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: jaan_platform.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: jaan-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.13.0"
