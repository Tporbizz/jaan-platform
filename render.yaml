databases:
  - name: jaan-db
    plan: free
    databaseName: jaan_platform
    user: jaan

services:
  - type: web
    name: jaan-platform
    plan: free
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
      python manage.py setup_production
      python manage.py import_market_list
      python manage.py import_recipes
      python manage.py link_menu_recipes
    startCommand: gunicorn jaan_platform.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: jaan_platform.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: jaan-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.13.0"

  # งานอัตโนมัติประจำวัน — สั่งซื้อ/หมดอายุ/สต็อกต่ำ/ปิดยอด P&L
  # รันตี 5 ตามเวลาไทย (22:00 UTC วันก่อนหน้า)
  - type: cron
    name: jaan-daily-automation
    plan: free
    runtime: python
    schedule: "0 22 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py run_daily_automation
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: jaan_platform.settings.production
      - key: SECRET_KEY
        fromService:
          type: web
          name: jaan-platform
          envVarKey: SECRET_KEY
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: jaan-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.13.0"
